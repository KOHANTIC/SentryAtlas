version: "2"

linters:
  default: standard
  enable:
    - copyloopvar
    - errorlint
    - misspell
  settings:
    errcheck:
      # HTTP response writes: a failed write to a client that already hung
      # up is not actionable, and every Fprint here targets ResponseWriter.
      exclude-functions:
        - (net/http.ResponseWriter).Write
        - fmt.Fprintf
        - fmt.Fprint
