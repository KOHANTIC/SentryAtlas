name: health

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# issues: write lets a failed check open its issue and a passing one close it.
permissions:
  contents: read
  issues: write

concurrency:
  group: health
  cancel-in-progress: false

jobs:
  # Asks the live API whether every source is fresh (/health/stale, backend/README.md).
  # Anything but 200 three times, a minute apart, opens an issue labelled "outage" or adds
  # to the open one; the next 200 closes it. The retries ride out a deploy, which answers
  # 503 for the seconds before its first polls.
  check:
    name: health check
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      URL: https://map.sentryatlas.com/health/stale
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Ask /health/stale
        id: check
        run: |
          for try in 1 2 3; do
            rm -f "$RUNNER_TEMP/body"
            code=$(curl -s -o "$RUNNER_TEMP/body" -w '%{http_code}' --max-time 20 "$URL") || code=000
            if [ "$code" = 200 ]; then echo "200 on try $try"; exit 0; fi
            answer=$(head -c 300 "$RUNNER_TEMP/body" 2>/dev/null | tr -d '\r\n' || true)
            echo "try $try: $code $answer"
            if [ "$try" -lt 3 ]; then sleep 60; fi
          done
          {
            echo "code=$code"
            echo "answer=$answer"
          } >> "$GITHUB_OUTPUT"
          exit 1
      - name: Open or update the issue
        if: failure() && steps.check.outcome == 'failure'
        env:
          CODE: ${{ steps.check.outputs.code }}
          ANSWER: ${{ steps.check.outputs.answer }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body=$(printf '`%s` answered %s three times, a minute apart, at %s: %s\n\n```\n%s\n```\n' \
            "$URL" "$CODE" "$(date -u +'%Y-%m-%d %H:%M UTC')" "$RUN_URL" "$ANSWER")
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label outage --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "The live API reports a stale or missing source" \
              --label outage --label "area: infra" --label bug --assignee kyrokohan --body "$body"
          fi
      - name: Close the issue once healthy
        if: success()
        run: |
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label outage --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue close "$open" --repo "$GITHUB_REPOSITORY" \
              --comment "\`$URL\` answers 200 again as of $(date -u +'%Y-%m-%d %H:%M UTC')."
          fi
