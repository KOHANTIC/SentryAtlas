version: 2
updates:
  # The backend's Go modules.
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: chore

  # The new site (#32).
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      web:
        patterns: ["*"]
    # Held at the majors the toolchain supports: typescript-eslint has no TypeScript 7
    # yet, Next's lint plugins no ESLint 10, and CI and the builds run Node 22.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # The actions in .github/workflows are pinned to a commit; this keeps the pin and the
  # version comment next to it current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
