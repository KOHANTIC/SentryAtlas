version: 2
updates:
  # The backend's Go modules. The two Next.js apps are left out: both are being replaced.
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: chore

  # The actions in .github/workflows are pinned to a commit; this keeps the pin and the
  # version comment next to it current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
