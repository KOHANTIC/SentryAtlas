# DigitalOcean App Platform spec for the map application
# (backend API + map frontend), served at map.sentryatlas.com.
#
# The landing site is a separate app — see .do/landing.yaml.
#
# Apply with:
#   doctl apps update <app-id> --spec .do/app.yaml
name: sentryatlas
region: sfo

domains:
  - domain: map.sentryatlas.com
    type: PRIMARY
    zone: sentryatlas.com

ingress:
  rules:
    # preserve_path_prefix keeps /api and /health intact for the backend,
    # which routes on the full path. Without it the platform strips the
    # matched prefix and /health arrives as /.
    - match:
        path:
          prefix: /api
      component:
        name: backend
        preserve_path_prefix: true
    - match:
        path:
          prefix: /health
      component:
        name: backend
        preserve_path_prefix: true
    - match:
        path:
          prefix: /
      component:
        name: frontend

services:
  - name: backend
    github:
      repo: KOHANTIC/SentryAtlas
      branch: main
      deploy_on_push: true
    dockerfile_path: backend/Dockerfile
    source_dir: /backend
    http_port: 8080
    health_check:
      http_path: /health
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    envs:
      - key: PORT
        value: "8080"
      - key: CACHE_TTL_MINUTES
        value: "5"
      - key: FETCH_TIMEOUT_SECONDS
        value: "45"
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      # Deliberately open: /api/v1/events is a public read-only endpoint
      # and is documented as usable without a key. Rate limiting, not
      # origin restriction, is what protects it.
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: NWS_USER_AGENT
        value: "SentryAtlas/1.0 (+https://github.com/KOHANTIC/SentryAtlas)"

  - name: frontend
    github:
      repo: KOHANTIC/SentryAtlas
      branch: main
      deploy_on_push: true
    dockerfile_path: frontend/Dockerfile
    source_dir: /frontend
    http_port: 3000
    # Smallest basic-tier size. The image is built on DO's build
    # infrastructure, so this only has to run the standalone Next server
    # (~100 MB RSS) serving one route.
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    envs:
      # Same-origin: the ingress rules above route /api to the backend, so
      # the browser calls map.sentryatlas.com/api/v1/events directly.
      # NEXT_PUBLIC_* is inlined at build time, hence BUILD_TIME scope.
      - key: NEXT_PUBLIC_API_URL
        value: "${APP_URL}"
        scope: BUILD_TIME
