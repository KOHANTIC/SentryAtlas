# DigitalOcean App Platform spec for the API, served at map.sentryatlas.com.
#
# The site, sentryatlas.com, is web/ on Cloudflare Workers (docs/deploy/cutover.md).
# The map host's other paths redirect there by a Cloudflare rule, before this app.
#
# Apply with:
#   doctl apps update <app-id> --spec .do/app.yaml
name: sentryatlas
region: sfo

domains:
  # No zone: that field asks App Platform to manage the domain's DNS, which is at Cloudflare.
  - domain: map.sentryatlas.com
    type: PRIMARY

ingress:
  rules:
    # preserve_path_prefix keeps /api and /health intact for the backend,
    # which routes on the full path. Without it the platform strips the
    # matched prefix and /health arrives as /.
    - match:
        path:
          prefix: /api
      component:
        name: backend
        preserve_path_prefix: true
    - match:
        path:
          prefix: /health
      component:
        name: backend
        preserve_path_prefix: true

services:
  - name: backend
    github:
      repo: KOHANTIC/SentryAtlas
      branch: main
      deploy_on_push: true
    dockerfile_path: backend/Dockerfile
    source_dir: /backend
    http_port: 8080
    health_check:
      http_path: /health
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    envs:
      - key: PORT
        value: "8080"
      - key: FETCH_TIMEOUT_SECONDS
        value: "45"
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      # The platform's edge writes the visitor's address into Do-Connecting-IP
      # and overwrites any value a client sends (checked 2026-11-22, IPv4 and
      # IPv6). X-Forwarded-For keeps client-sent values at its start, and
      # True-Client-IP, Forwarded and X-Client-IP pass through untouched, so
      # none of those can key the rate limit.
      - key: CLIENT_IP_HEADER
        value: Do-Connecting-IP
      # Deliberately open: /api/v1/events is a public read-only endpoint
      # and is documented as usable without a key. Rate limiting, not
      # origin restriction, is what protects it.
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: NWS_USER_AGENT
        value: "SentryAtlas/1.0 (+https://github.com/KOHANTIC/SentryAtlas)"
      # Set in the dashboard, not here: RESEND_API_KEY and WAITLIST_SECRET
      # (encrypted), MAIL_FROM, MAIL_REPLY_TO, RESEND_TOPIC_ALERTS and
      # RESEND_TOPIC_NEWS, which name this deployment's operator and its
      # provider (backend/README.md). Applying this spec as it stands would
      # remove them.
