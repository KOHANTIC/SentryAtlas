# DigitalOcean App Platform spec for the static landing site,
# served at sentryatlas.com. Deployed as its own app so that marketing
# copy can ship without redeploying the API or the map.
#
# The map application is a separate app — see .do/app.yaml.
#
# Apply with:
#   doctl apps update <app-id> --spec .do/landing.yaml
name: sentryatlas-landing
region: sfo

domains:
  - domain: sentryatlas.com
    type: PRIMARY
    zone: sentryatlas.com

ingress:
  rules:
    - match:
        path:
          prefix: /
      component:
        name: landing

static_sites:
  - name: landing
    github:
      repo: KOHANTIC/SentryAtlas
      branch: main
      deploy_on_push: true
    source_dir: /landing
    build_command: npm ci && npm run build
    # next.config.ts sets output: "export"
    output_dir: out
